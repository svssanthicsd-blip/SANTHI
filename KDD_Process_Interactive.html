<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KDD Process in Data Mining</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:20px}
h1{text-align:center}
.container{display:flex;flex-wrap:wrap;justify-content:center;gap:15px;margin-top:30px}
.step{
width:180px;padding:15px;border-radius:10px;background:white;
box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;text-align:center;
transition:transform .2s;
}
.step:hover{transform:scale(1.05)}
.details{
margin-top:25px;padding:20px;background:white;border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15)
}
.arrow{font-size:28px;align-self:center}
</style>
<script>
function showInfo(title, desc){
 document.getElementById("info").innerHTML =
 "<h2>"+title+"</h2><p>"+desc+"</p>";
}
</script>
</head>
<body>
<h1>KDD Process in Data Mining</h1>

<div class="container">
<div class="step" onclick="showInfo('Data Selection','Relevant data is collected from databases, files, and other sources.')">1. Data Selection</div>
<div class="arrow">➜</div>

<div class="step" onclick="showInfo('Data Cleaning','Missing values, noise, and inconsistencies are removed.')">2. Data Cleaning</div>
<div class="arrow">➜</div>

<div class="step" onclick="showInfo('Data Transformation','Data is normalized, aggregated, and converted into suitable formats.')">3. Data Transformation</div>
<div class="arrow">➜</div>

<div class="step" onclick="showInfo('Data Mining','Algorithms discover patterns, relationships, and knowledge.')">4. Data Mining</div>
<div class="arrow">➜</div>

<div class="step" onclick="showInfo('Pattern Evaluation','Interesting and useful patterns are identified and validated.')">5. Pattern Evaluation</div>
<div class="arrow">➜</div>

<div class="step" onclick="showInfo('Knowledge Presentation','Knowledge is visualized and presented to users for decision making.')">6. Knowledge Presentation</div>
</div>

<div id="info" class="details">
<h2>Click Any Step</h2>
<p>Interactive explanation of the KDD (Knowledge Discovery in Databases) process will appear here.</p>
</div>

</body>
</html>
